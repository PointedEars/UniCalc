<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniCalc (Unicode Calculator) — PointedEars’ Website</title>
    <style type="text/css">
      <!--
      table {
        width: 100%;
      }

      th {
        width: 8em;
        text-align: right;
      }

      th:after {
        content: ":";
      }

      [lang^="fr"] th:after {
        content: "\00A0 :";
      }

      .td3 {
        width: 8em;
      }

      input {
        width: 100%;
      }

      #unicode {
        font-family: 'DejaVu Sans', sans-serif;
      }
      -->
    </style>
    <script type="text/javascript" src="../object.js"></script>
    <script type="text/javascript" src="../regexp.js"></script>
    <script type="text/javascript" src="unicalc.js"></script>
  </head>
  <body>
    <h1>UniCalc – Unicode Calculator</h1>
    <form action="http://www.google.com/search" target="result"
          onsubmit="return calc(this)">
      <table>
        <tr>
          <th><label for="ascii"><u>A</u>SCII formula</label></th>
          <td><input type="search" id="ascii" name="q" accesskey="a"
            onkeyup="updateUnicode(this)"
            oninput="updateUnicode(this)"
            ></td>
            <td class="td3"><input type="submit" value="Calculate (Google)"></td>
          </tr>
          <tr>
            <th><label for="unicode"><u>U</u>nicode formula</label></th>
            <td><input type="search" id="unicode" name="unicode" accesskey="u"
              onkeyup="toASCII(this)"
              oninput="toASCII(this)"
              ></td>
            <td class="td3"><input type="button" value="Copy" onclick='navigator.clipboard.writeText(this.form["unicode"].value)'></td>
          </tr>
      </table>
    </form>
  </body>
</html>
