<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniCalc (Unicode Calculator) — PointedEars’ Website</title>
    <style type="text/css">
      <!--
      table {
        width: 100%;
      }

      th {
        width: 8em;
        vertical-align: baseline;
        text-align: right;
      }

      th:after {
        content: ":";
      }

      [lang^="fr"] th:after {
        content: "\00A0 :";
      }

      .td3 {
        width: 8em;
        vertical-align: baseline;
      }

      textarea {
        width: 98%;
        height: 3.5em;
      }

      .td3 button {
        width: 100%;
      }

      #unicode {
        font-family: 'DejaVu Sans', sans-serif;
      }
      -->
    </style>
    <script type="text/javascript" src="../object.js"></script>
    <script type="text/javascript" src="../regexp.js"></script>
    <script type="text/javascript" src="unicalc.js"></script>
  </head>
  <body>
    <h1>UniCalc – Unicode Calculator</h1>
    <form action="http://www.google.com/search" target="result"
          onsubmit="return calc(this)">
      <table>
        <tr>
          <th><label for="ascii"><u>A</u>SCII formula</label></th>
          <td><select name="symbol" title="Characters/Symbols">
            <option value="">Select character/symbol</option>
            <optgroup id="greek" label="Greek letters">
              <option value="^alpha">&alpha;</option>
            </optgroup>
            <optgroup id="math" label="Mathematical symbols"></optgroup>
            <optgroup id="subscripts" label="Subscripts"></optgroup>
            <optgroup id="superscripts" label="Superscripts"></optgroup>
          </select><button type="button" onclick="insertSymbol(this)">Insert</button><br>
            <textarea type="search" id="ascii" name="q" accesskey="a"
            onkeyup="updateUnicode(this)"
            oninput="updateUnicode(this)"
            ></textarea></td>
            <td class="td3"><button type="submit" accesskey="l">Ca<u>l</u>culate (Google)</button></td>
          </tr>
          <tr>
            <th><label for="unicode"><u>U</u>nicode formula</label></th>
            <td><textarea type="search" id="unicode" name="unicode" accesskey="u"
              onkeyup="toASCII(this)"
              oninput="toASCII(this)"
              ></textarea></td>
            <td class="td3"><button type="button" id="btCopy" accesskey="c"
              onclick='navigator.clipboard.writeText(this.form["unicode"].value)'><u>C</u>opy</button></td>
          </tr>
      </table>
    </form>
  </body>
</html>
